name: CI

on:
  push:
    branches: [ main ]
    tag: ["v*"]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Detect version tag
        id: version
        shell: bash
        run: |
          VERSION=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
