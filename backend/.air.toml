root = "." 
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  entrypoint = ["./tmp/main"]

  delay = 200
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go", "html", "css", "tmpl", "tpl"]
  poll = true
  poll_interval = 500

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[proxy]
  enabled = true
  proxy_port = 3000
  app_port = 8091
