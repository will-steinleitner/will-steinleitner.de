{{ define "home/page" }}
<section class="flex flex-1 items-center justify-center py-16">
  <div
    class="w-full max-w-lg rounded-2xl bg-gradient-to-r from-sky-400 via-indigo-400 to-fuchsia-500 p-px shadow-lg shadow-indigo-100"
  >
    <div class="rounded-2xl bg-white px-8 py-12 text-center sm:px-12">
      <div
        class="mx-auto mb-8 flex size-16 items-center justify-center rounded-2xl bg-gradient-to-r from-sky-400 via-indigo-400 to-fuchsia-500 shadow-md shadow-indigo-200"
      >
        <img src="/assets/icons/wrench-screwdriver.svg" class="size-9 brightness-0 invert" alt="" />
      </div>

      <h1 class="mb-4 font-mono text-3xl font-bold tracking-tight sm:text-4xl">
        <span class="bg-gradient-to-r from-sky-400 via-indigo-400 to-fuchsia-500 bg-clip-text text-transparent">
          Under maintenance
        </span>
      </h1>

      <p class="text-base leading-relaxed text-gray-500">
        This site is currently being worked on.<br />
        Please check back soon.
      </p>

      <div class="mt-8 flex items-center justify-center gap-2" aria-hidden="true">
        <span class="animate-pulse">
          <span class="block size-2 animate-pulse rounded-full bg-sky-400"></span>
        </span>
        <span class="animate-pulse [animation-delay:200ms]">
          <span class="block size-2 animate-pulse rounded-full bg-indigo-400 [animation-delay:200ms]"></span>
        </span>
        <span class="animate-pulse [animation-delay:400ms]">
          <span class="block size-2 animate-pulse rounded-full bg-fuchsia-500 [animation-delay:400ms]"></span>
        </span>
      </div>
    </div>
  </div>
</section>
{{ end }}
